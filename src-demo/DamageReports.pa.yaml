Screens:
  DamageReports:
    Properties:
      Fill: =ColorValue("#F3F5F9")
      OnVisible: =Set(varOperator,LookUp(FleetMembers,Person.Email=varDemoUser.Email));UpdateContext({locLoadError:"",locTechnicalOnly:false});If(Coalesce(varDmgPerfInitialized,false) && !Coalesce(varDmgPerfBusy,false) && (IsBlank(varDmgPerfDamageLoadedAt) || DateDiff(varDmgPerfDamageLoadedAt,Now(),TimeUnit.Seconds)>=300 || IsBlank(varDmgPerfDecisionLoadedAt) || DateDiff(varDmgPerfDecisionLoadedAt,Now(),TimeUnit.Seconds)>=300),Select(DmgPerfRefreshLoad))
    Children:
      - DmgRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorValue("#F2F5FA")
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =Coalesce(dmgPopAcknowledged,false)
            Width: =Parent.Width
          Children:
            - DmgHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorValue("#E8EBF1")
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                Children:
                  - DmgHeading:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorValue("#10233F")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =If(Parent.Width<450,18,22)
                        Text: ="DEMO · Vehicle condition"
                        Wrap: =false
            - DmgVehicleContext:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorValue("#14253D")
                  Font: =Font.'Segoe UI'
                  Height: =48
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  Size: =14
                  Text: =If(Coalesce(locMode,"List")="List",If(varVehicleId>0,"Vehicle · " & varVehicle.Registration,"Select a vehicle"),If(locMode="Detail" || locMode="Decision","Vehicle · " & LookUp(FleetDamageReports,ID=varReportId).Vehicle.Value,"Vehicle · " & locDamageVehicle.Registration))
            - DmgError:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorValue("#C8102E")
                  Font: =Font.'Segoe UI'
                  Height: =64
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Live: =Live.Assertive
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  Size: =16
                  Text: =Coalesce(locError,locLoadError)
                  Visible: =!IsBlank(locError) || !IsBlank(locLoadError)
            - DmgLoadRetry:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: =If(locUncertain,"Check save status","Reload")
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Outline
                  BasePaletteColor: =ColorValue("#C8102E")
                  BorderColor: =ColorValue("#DDE5EF")
                  BorderThickness: =1
                  Color: =ColorValue("#14253D")
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =48
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =UpdateContext({locLoadError:"",DmgPerfRetryRequested:locUncertain});Select(DmgPerfRefreshLoad)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =16
                  Text: =If(locUncertain,"Check save status","Reload")
                  Visible: =!IsBlank(locLoadError) || locUncertain
                  Width: =Parent.Width
            - DmgBrowseActions:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Coalesce(locMode,"List")="List"
                Children:
                  - DmgNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="New damage"
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =ColorValue("#C8102E")
                        BorderThickness: =0
                        Color: =Color.White
                        DisplayMode: =If(Coalesce(locMailBusy,false),DisplayMode.Disabled,DisplayMode.Edit)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =48
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =If(varVehicleId=0,UpdateContext({locError:"First select a vehicle under Vehicle."}),UpdateContext({locMode:"Position",locDmgFixReady:false,locDmgFixReportId:Blank(),locDamageVehicleId:varVehicleId,locDamageVehicle:varVehicle,locError:"",locSaved:false,locBusy:false,locMailAuto:false,locMailAutomaticId:0,locMailConfirmId:0,locMailBusy:false,locMailTargetId:0,locMailMessage:"",locDiscard:false,locDecisionConfirm:false,locUncertain:false,locCapture:Now(),locDamageKey:"FLEET-" & Text(GUID()),locReporter:varOperator,locOwner:LookUp(FleetMembers,ID=0),locSavedId:0,locX:0.5,locY:0.5,locArea:"",locView:"",locSeverity:"",locReportType:"",locDescription:""}); Reset(DmgArea);Reset(DmgView);Reset(DmgX);Reset(DmgY);Reset(DmgDescription);Reset(DmgSeverity);Reset(reportTypeChoice);ViewForm(DmgEvidenceForm))
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Size: =14
                        Text: ="New damage"
                  - DmgRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Refresh"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =ColorValue("#C8102E")
                        BorderColor: =ColorValue("#DDE5EF")
                        BorderThickness: =1
                        Color: =ColorValue("#14253D")
                        DisplayMode: =If(Coalesce(locMailBusy,false) || Coalesce(varDmgPerfBusy,false),DisplayMode.Disabled,DisplayMode.Edit)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =48
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =UpdateContext({locLoadError:""});Select(DmgPerfRefreshLoad)
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Size: =16
                        Text: =If(Coalesce(varDmgPerfBusy,false),"Loading …","Reload")
            - DmgEmpty:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorValue("#14253D")
                  Font: =Font.'Segoe UI'
                  Height: =48
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  Size: =16
                  Text: =If(Coalesce(locTechnicalOnly,false),If(Coalesce(locShowCompleted,false),"No technical faults recorded for this vehicle.","No open technical faults for this vehicle."),If(Coalesce(locShowCompleted,false),"No damage recorded.","No open damage reports for this vehicle."))
                  Visible: =Coalesce(locMode,"List")="List" && varVehicleId>0 && IsBlank(locLoadError) && Coalesce(locShowList,false) && IsEmpty(DmgReports.AllItems)
            - btnDmgMapToggle:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: =Self.Text
                  AlignInContainer: =AlignInContainer.Center
                  Appearance: =ButtonAppearance.Outline
                  BasePaletteColor: =ColorValue("#C8102E")
                  BorderColor: =ColorValue("#DDE5EF")
                  BorderThickness: =1
                  Color: =ColorValue("#14253D")
                  Font: =Font.'Segoe UI'
                  Height: =44
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =UpdateContext({locShowList:!(Coalesce(locShowList,false) || Coalesce(locMapFilter,false)),locMapFilter:false,locTechnicalOnly:false});Reset(DmgReports)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Text: =If(Coalesce(locShowList,false) || Coalesce(locMapFilter,false),"Show vehicle views","Show report list")
                  Visible: =Coalesce(locMode,"List")="List" && varVehicleId>0
                  Width: =Min(Parent.Width-24,640)
            - btntdfTechnical:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: =If(Coalesce(locTechnicalOnly,false),"Clear the technical fault filter and show all reports","Show technical faults")
                  AlignInContainer: =AlignInContainer.Center
                  Appearance: =ButtonAppearance.Outline
                  BorderColor: =ColorValue("#DDE5EF")
                  BorderThickness: =1
                  Color: =ColorValue("#14253D")
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =UpdateContext({locTechnicalOnly:!Coalesce(locTechnicalOnly,false),locShowList:true,locMapFilter:false});Reset(DmgReports)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =14
                  Text: =If(Coalesce(locTechnicalOnly,false),"Clear technical fault filter","Show technical faults")
                  Visible: =Coalesce(locMode,"List")="List" && varVehicleId>0
                  Width: =Min(Parent.Width-24,640)
            - btnDmgCompletedFilter:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: =Self.Text
                  AlignInContainer: =AlignInContainer.Center
                  Appearance: =ButtonAppearance.Outline
                  BasePaletteColor: =ColorValue("#C8102E")
                  BorderColor: =ColorValue("#DDE5EF")
                  BorderThickness: =1
                  Color: =ColorValue("#14253D")
                  Font: =Font.'Segoe UI'
                  Height: =44
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =UpdateContext({locShowCompleted:!Coalesce(locShowCompleted,false),locMapFilter:false});Reset(DmgReports)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Text: =If(Coalesce(locShowCompleted,false),"Hide completed","Show completed")
                  Visible: =Coalesce(locMode,"List")="List" && varVehicleId>0
                  Width: =Min(Parent.Width-24,640)
            - lblDmgMapGuide:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  AutoHeight: =true
                  Color: =ColorValue("#64748B")
                  Font: =Font.'Segoe UI'
                  Height: =44
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: |-
                    =If(Coalesce(locTechnicalOnly,false),If(Coalesce(locShowCompleted,false),"Filter: Technical faults · including completed reports","Filter: Technical faults · open and unreviewed"),If(Coalesce(locMapFilter,false),locMapView & " · Select a report at this position.",Coalesce(locShowList,false),If(Coalesce(locShowCompleted,false),"All reports including completed damage reports","Open and unreviewed reports"),If(Coalesce(locShowCompleted,false),"Tap a point · Red = open · Green = completed","Tap a point · Open and unreviewed damage reports")))
                  Visible: =Coalesce(locMode,"List")="List" && varVehicleId>0
                  Width: =Min(Parent.Width-24,640)
